name: Gateway npm Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish, for example v0.1.0."
        required: true
        type: string

permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_LOGLEVEL: error
  NPM_CONFIG_PROGRESS: "false"

jobs:
  publish:
    name: Publish gateway package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set +x
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag."
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" != "$version" ]]; then
            echo "::error::package.json version $package_version does not match $RELEASE_TAG."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate package
        run: npm run typecheck && npm test && npm run build

      - name: Publish package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set +x
          version="${RELEASE_TAG#v}"
          name="@waifucave/gateway"
          if npm view "$name@$version" version --silent >/dev/null 2>&1; then
            echo "$name@$version already published; skipping."
          else
            npm publish --access public
          fi
